services:
  mcp-server:
    image: mcp-server:local
    build: ./services/mcp_server
    env_file:
      - ./services/mcp_server/.env
    environment:
      # aws credentials
      - AWS_ACCESS_KEY_ID=ASIA6AR5RCK6A7ORIXEA
      - AWS_SECRET_ACCESS_KEY=m3Ok3LzAtSb3jlm9lxxBPwJE9afJGZ1z4haCCKMk
      - AWS_SESSION_
      - AWS_REGION=eu-west-3
      # GDFC S3 Configuration (from .env, explicit override for clarity)
      - GDFC_DROUGHT_S3=s3://global-drought-flood-catalogue/Hazard-Maps/Drought-Frequency/
      - GDFC_FLOOD_S3=s3://global-drought-flood-catalogue/Hazard-Maps/Pluvial-Frequency/
      - BDTOPO_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/bdtopo
    ports:
      - "8000:8000"
    networks:
      - app-network

  agent-server:
    image: agent-server:local
    build: ./services/agent_server
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000
      - BEDROCK_MODEL_ID=eu.anthropic.claude-3-7-sonnet-20250219-v1:0
      - BEDROCK_MAX_TOKENS=4096
      - LOG_LEVEL=debug
      - WORKERS=1
      # aws credentials
      - AWS_ACCESS_KEY_ID=ASIAZI2LCFKKJ5REGH7W
      - AWS_SECRET_ACCESS_KEY=Q+H2+0HXVzFL2kJF+yDSdgeFAEjGyCliC1kJlw12
      - AWS_SESSION_
      - AWS_REGION=eu-west-3
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - mcp-server

  streamlit:
    image: streamlit:local
    build: ./services/streamlit
    environment:
      - AGENT_MODE=remote
      - AGENT_SERVER_URL=ws://localhost:8080
      # aws credentials
      - AWS_ACCESS_KEY_ID=ASIAZI2LCFKKJ5REGH7W
      - AWS_SECRET_ACCESS_KEY=Q+H2+0HXVzFL2kJF+yDSdgeFAEjGyCliC1kJlw12
      - AWS_SESSION_
      - AWS_REGION=eu-west-3
    volumes:
      - ./.cursor:/app/.cursor
    ports:
      - "8501:8501"
    depends_on:
      agent-server:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge