                  pip install pytest pytest-mock pytest-cov

            - name: Run tests with pytest and coverage
              working-directory: services/mcp_server
              run: |
                  pytest -v --cov=. --cov-report=xml --cov-report=html --cov-report=term

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pytest-results-mcp-server-${{ matrix.python-version }}
                  path: |
                      services/mcp_server/.pytest_cache/
                      services/mcp_server/htmlcov/
                      services/mcp_server/coverage.xml
