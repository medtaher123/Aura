            - name: Run tests with pytest and coverage
              run: |
                  pytest -v --cov=. --cov-report=xml --cov-report=html --cov-report=term

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pytest-results-${{ matrix.python-version }}
                  path: |
                      .pytest_cache/
                      htmlcov/
                      coverage.xml
