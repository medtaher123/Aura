name: CI Streamlit

on:
    push:
        branches: [main, develop, Multi-agents]
        paths:
            - "services/streamlit/**"
            - ".github/workflows/ci-streamlit.yaml"
    pull_request:
        branches: [main, develop, Multi-agents]
        paths:
            - "services/streamlit/**"
            - ".github/workflows/ci-streamlit.yaml"

jobs:
    test:
        name: Test Streamlit
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.12"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"

            - name: Install dependencies
              working-directory: services/streamlit
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest pytest-mock pytest-cov

            - name: Run tests with pytest and coverage
              working-directory: services/streamlit
              env:
                  PYTHONPATH: .
              run: |
                  pytest --rootdir=. -c pytest.ini -v -m 'not integration' --cov=. --cov-report=xml --cov-report=html --cov-report=term

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pytest-results-streamlit-${{ matrix.python-version }}
                  path: |
                      services/streamlit/.pytest_cache/
                      services/streamlit/htmlcov/
                      services/streamlit/coverage.xml
