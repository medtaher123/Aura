name: CI Agent Server

on:
    push:
        branches: [main, develop, Multi-agents]
        paths:
            - "services/agent_server/**"
            - ".github/workflows/ci-agent-server.yaml"
    pull_request:
        branches: [main, develop, Multi-agents]
        paths:
            - "services/agent_server/**"
            - ".github/workflows/ci-agent-server.yaml"

jobs:
    test:
        name: Test Agent Server
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.12"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"

            - name: Install dependencies
              working-directory: services/agent_server
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest pytest-mock pytest-cov

            - name: Run tests with pytest and coverage
              working-directory: services/agent_server
              run: |
                  pytest -v -m 'not integration' --cov=. --cov-report=xml --cov-report=html --cov-report=term

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pytest-results-agent-server-${{ matrix.python-version }}
                  path: |
                      services/agent_server/.pytest_cache/
                      services/agent_server/htmlcov/
                      services/agent_server/coverage.xml
