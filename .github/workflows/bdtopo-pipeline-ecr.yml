name: Build and Push BDTOPO Pipeline to ECR

on:
    push:
        branches:
            - main
            - develop
        paths:
            - "services/bdtopo_pipeline/**"
            - ".github/workflows/bdtopo-pipeline-ecr.yml"
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy to"
                required: true
                default: "staging"
                type: choice
                options:
                    - production
                    - staging

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    AWS_REGION: eu-west-3
    ECR_REPOSITORY: eo-agent-bdtopo-pipeline
    SERVICE_PATH: services/bdtopo_pipeline

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        outputs:
            image-tag: ${{ steps.meta.outputs.version }}
            image-digest: ${{ steps.build-and-push.outputs.digest }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  role-session-name: GitHubActions-${{ github.run_id }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix={{branch}}-,enable=true
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                  flavor: |
                      latest=auto

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              id: build-and-push
              uses: docker/build-push-action@v5
              with:
                  context: ./${{ env.SERVICE_PATH }}
                  file: ./${{ env.SERVICE_PATH }}/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64
                  provenance: false

            - name: Image digest
              run: |
                  echo "Image pushed with digest: ${{ steps.build-and-push.outputs.digest }}"
                  echo "Image tags: ${{ steps.meta.outputs.tags }}"

            - name: Post build summary
              if: always()
              run: |
                  echo "## BDTOPO Pipeline Build Summary" >> $GITHUB_STEP_SUMMARY
                  echo "- **Image Digest**: ${{ steps.build-and-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Repository**: ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
