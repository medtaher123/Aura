[pytest]
# Stop pytest from walking up to the repo-root pyproject.toml so ``modules``
# / ``utils`` / leftover ``tools`` imports resolve from this service.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings = ignore::DeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    asyncio: Async tests
