[pytest]
# Keep CI/local collection inside this service. The repo-root pyproject.toml
# also puts agent_server on pythonpath, which shadows ``src.core``.
pythonpath = . src
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings = ignore::DeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    asyncio: Async tests
