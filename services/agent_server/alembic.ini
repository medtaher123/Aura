# Alembic configuration for the Agent Server.
#
# The database URL is intentionally NOT hardcoded here: env.py reads it from the
# DATABASE_URL environment variable (and normalizes it to the asyncpg driver).

[alembic]
script_location = alembic
prepend_sys_path = .
# Use a date-prefixed slug for new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Placeholder only; overridden at runtime by env.py from DATABASE_URL.
sqlalchemy.url = postgresql+asyncpg://metaplanet:metaplanet@localhost:5432/metaplanet
# TODO: mtbh hat does this file do (use .env?) answer: it's used to generate the database schema, we should use the .env file to set the database URL.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
