[project]
name = "agent-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "aioboto3>=15.5.0,<16",
    "boto3>=1.40.46,<1.40.62",
    "botocore>=1.40.46,<1.40.62",
    "aiosqlite==0.22.1",
    "asyncpg>=0.29.0",
    "ddgs>=6.0.0",
    "debugpy>=1.8.21",
    "deep-translator>=1.11.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.1",
    "langchain>=0.3.26,<1.4",
    "langchain-aws>=1.1.0,<1.2",
    "langchain-core>=0.3.67,<1.5",
    "langdetect>=1.0.9",
    "langgraph>=0.5.1",
    "langgraph-checkpoint>=2.1.0",
    "mcp>=2.0.0",
    "pgvector>=0.3.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.5.2",
    "pyjwt[crypto]>=2.10.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "asyncio: Async tests",
]

